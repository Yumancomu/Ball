<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Spike Climb</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation; /* スマホのダブルタップ拡大を防ぐ */
        }
        canvas {
            background: #f4f4f8;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ゲームの状態
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highScore = 0;

        // ボールの設定
        const ball = {
            x: 180,
            y: 450,
            radius: 14,
            baseVx: 4.5,   // 基本の横移動速度
            vx: 4.5,       
            vy: 0,         
            gravity: 0.45, 
            jumpPower: -9.5 
        };

        // 壁とトゲの設定
        const wallWidth = 15;
        let spikes = []; 
        let nextSpikeY = 350; 

        // ボールのカラーパレット（スコア1000ごとに順番に変化）
        const ballColors = [
            '#007aff', // 0〜999: 青
            '#ff9500', // 1000〜1999: オレンジ
            '#34c759', // 2000〜2999: 緑
            '#af52de', // 3000〜3999: 紫
            '#ff2d55', // 4000〜4999: ピンク
            '#ffcc00'  // 5000〜: 黄色
        ];

        // 初期化関数
        function resetGame() {
            ball.x = canvas.width / 2;
            ball.y = 450;
            ball.vx = ball.baseVx;
            ball.vy = 0;
            score = 0;
            spikes = [];
            nextSpikeY = 350;

            for (let i = 0; i < 6; i++) {
                spawnSpike();
            }
        }

        // トゲを生成する関数
        function spawnSpike() {
            const side = Math.random() < 0.5 ? 'left' : 'right';
            spikes.push({
                side: side,
                y: nextSpikeY,
                height: 36, 
                width: 18   
            });
            const minGap = Math.max(90, 160 - score * 1.5);
            nextSpikeY -= minGap + Math.random() * 60;
        }

        // タップ・クリック・スペースキーの操作
        function handleInput() {
            if (gameState === 'START') {
                resetGame();
                gameState = 'PLAYING';
                ball.vy = ball.jumpPower;
            } else if (gameState === 'PLAYING') {
                ball.vy = ball.jumpPower;
            } else if (gameState === 'GAMEOVER') {
                resetGame();
                gameState = 'PLAYING';
                ball.vy = ball.jumpPower;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInput();
        });
        canvas.addEventListener('pointerdown', handleInput);

        // 更新処理
        function update() {
            if (gameState !== 'PLAYING') return;

            // 【100点ごとにスピードアップ】
            // スコアが100増えるごとに、横移動速度（vx）が少しずつ速くなります（最大で元の2倍まで）
            let speedMultiplier = 1 + Math.floor(score / 100) * 0.08;
            let currentVx = ball.baseVx * speedMultiplier;

            // ボールの移動（現在の向きを維持して速度を反映）
            ball.vy += ball.gravity;
            ball.x += (ball.vx > 0 ? 1 : -1) * currentVx;
            ball.y += ball.vy;

            // 左右の壁での反射
            if (ball.x - ball.radius <= wallWidth) {
                ball.x = wallWidth + ball.radius;
                ball.vx = Math.abs(ball.vx); 
            } else if (ball.x + ball.radius >= canvas.width - wallWidth) {
                ball.x = canvas.width - wallWidth - ball.radius;
                ball.vx = -Math.abs(ball.vx); 
            }

            // 画面の上昇（カメラ追従）
            const cameraThreshold = 280;
            if (ball.y < cameraThreshold) {
                const diff = cameraThreshold - ball.y;
                ball.y = cameraThreshold;
                nextSpikeY += diff;

                spikes.forEach(spike => {
                    spike.y += diff;
                });

                score += diff * 0.05;
            }

            if (spikes.length > 0 && spikes[0].y > canvas.height + 50) {
                spikes.shift();
                spawnSpike();
            }

            if (ball.y - ball.radius > canvas.height) {
                triggerGameOver();
            }

            // 当たり判定（当たり判定を少し甘くする設定: hitMargin = 6）
            const hitMargin = 6;
            for (let spike of spikes) {
                const inY = (ball.y + ball.radius - hitMargin > spike.y) &&
                            (ball.y - ball.radius + hitMargin < spike.y + spike.height);

                if (inY) {
                    if (spike.side === 'left' && ball.x - ball.radius + hitMargin < wallWidth + spike.width) {
                        triggerGameOver();
                    }
                    if (spike.side === 'right' && ball.x + ball.radius - hitMargin > canvas.width - wallWidth - spike.width) {
                        triggerGameOver();
                    }
                }
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            const finalScore = Math.floor(score);
            if (finalScore > highScore) {
                highScore = finalScore;
            }
        }

        // 描画処理
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // スコアの表示（背景に大きく）
            ctx.fillStyle = '#e0e0e8';
            ctx.font = 'bold 100px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(Math.floor(score), canvas.width / 2, canvas.height / 2);

            // 左右の壁の描画
            ctx.fillStyle = '#555';
            ctx.fillRect(0, 0, wallWidth, canvas.height);
            ctx.fillRect(canvas.width - wallWidth, 0, wallWidth, canvas.height);

            // トゲの描画
            ctx.fillStyle = '#ff3b30';
            spikes.forEach(spike => {
                ctx.beginPath();
                if (spike.side === 'left') {
                    ctx.moveTo(wallWidth, spike.y);
                    ctx.lineTo(wallWidth + spike.width, spike.y + spike.height / 2);
                    ctx.lineTo(wallWidth, spike.y + spike.height);
                } else {
                    ctx.moveTo(canvas.width - wallWidth, spike.y);
                    ctx.lineTo(canvas.width - wallWidth - spike.width, spike.y + spike.height / 2);
                    ctx.lineTo(canvas.width - wallWidth, spike.y + spike.height);
                }
                ctx.closePath();
                ctx.fill();
            });

            // 【スコア1000ごとに色が変わるボールの描画】
            let colorIndex = Math.floor(score / 1000) % ballColors.length;
            ctx.fillStyle = ballColors[colorIndex];
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // オーバーレイ画面
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'white';
                ctx.font = 'bold 32px sans-serif';
                ctx.fillText(gameState === 'START' ? 'TAP TO START' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

                ctx.font = '18px sans-serif';
                if (gameState === 'GAMEOVER') {
                    ctx.fillText('SCORE: ' + Math.floor(score) + '  |  BEST: ' + highScore, canvas.width / 2, canvas.height / 2 + 15);
                }
                ctx.fillText('タップ / スペースでジャンプ', canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        resetGame();
        loop();
    </script>
</body>
</html>
