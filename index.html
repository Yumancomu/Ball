<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Spike Climb</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            background: #f4f4f8;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ゲームの状態
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highScore = 0;

        // ボールの設定
        const ball = {
            x: 180,
            y: 450,
            radius: 14,
            vx: 4.5,       // 横の移動速度
            vy: 0,         // 縦の移動速度
            gravity: 0.45, // 重力
            jumpPower: -9.5 // タップ時の上昇力
        };

        // 壁とトゲの設定
        const wallWidth = 15;
        let spikes = []; // { side: 'left'|'right', y: number, size: number }
        let nextSpikeY = 300; // 次のトゲを生成する高さ

        // 初期化関数
        function resetGame() {
            ball.x = canvas.width / 2;
            ball.y = 450;
            ball.vx = 4.5;
            ball.vy = 0;
            score = 0;
            spikes = [];
            nextSpikeY = 350;

            // 初期のトゲをいくつか配置
            for (let i = 0; i < 6; i++) {
                spawnSpike();
            }
        }

        // トゲを生成する関数
        function spawnSpike() {
            const side = Math.random() < 0.5 ? 'left' : 'right';
            spikes.push({
                side: side,
                y: nextSpikeY,
                height: 36, // トゲの縦幅
                width: 18   // トゲの突き出し長さ
            });
            // 上に行くほどトゲの間隔を少しずつ狭くする（難易度アップ）
            const minGap = Math.max(90, 160 - score * 1.5);
            nextSpikeY -= minGap + Math.random() * 60;
        }

        // タップ・クリック・スペースキーの操作
        function handleInput() {
            if (gameState === 'START') {
                resetGame();
                gameState = 'PLAYING';
                ball.vy = ball.jumpPower;
            } else if (gameState === 'PLAYING') {
                ball.vy = ball.jumpPower;
            } else if (gameState === 'GAMEOVER') {
                resetGame();
                gameState = 'PLAYING';
                ball.vy = ball.jumpPower;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInput();
        });
        canvas.addEventListener('pointerdown', handleInput);

        // 更新処理
        function update() {
            if (gameState !== 'PLAYING') return;

            // ボールの移動
            ball.vy += ball.gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 左右の壁での反射
            if (ball.x - ball.radius <= wallWidth) {
                ball.x = wallWidth + ball.radius;
                ball.vx = Math.abs(ball.vx); // 右へ反射
            } else if (ball.x + ball.radius >= canvas.width - wallWidth) {
                ball.x = canvas.width - wallWidth - ball.radius;
                ball.vx = -Math.abs(ball.vx); // 左へ反射
            }

            // 画面の上昇（カメラ追従）
            const cameraThreshold = 280;
            if (ball.y < cameraThreshold) {
                const diff = cameraThreshold - ball.y;
                ball.y = cameraThreshold;
                nextSpikeY += diff;

                // トゲを下にずらす
                spikes.forEach(spike => {
                    spike.y += diff;
                });

                // 上昇した分だけスコア加算
                score += diff * 0.05;
            }

            // 画面下に消えたトゲを削除し、新しいトゲを上に追加
            if (spikes.length > 0 && spikes[0].y > canvas.height + 50) {
                spikes.shift();
                spawnSpike();
            }

            // 画面の下端に落ちたらゲームオーバー
            if (ball.y - ball.radius > canvas.height) {
                triggerGameOver();
            }

            // トゲとの当たり判定（少しだけ判定を甘くして遊びやすくしています）
            const hitMargin = 4;
            for (let spike of spikes) {
                const inY = (ball.y + ball.radius - hitMargin > spike.y) &&
                            (ball.y - ball.radius + hitMargin < spike.y + spike.height);

                if (inY) {
                    if (spike.side === 'left' && ball.x - ball.radius + hitMargin < wallWidth + spike.width) {
                        triggerGameOver();
                    }
                    if (spike.side === 'right' && ball.x + ball.radius - hitMargin > canvas.width - wallWidth - spike.width) {
                        triggerGameOver();
                    }
                }
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            const finalScore = Math.floor(score);
            if (finalScore > highScore) {
                highScore = finalScore;
            }
        }

        // 描画処理
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景のスコア表示（薄く大きく表示）
            ctx.fillStyle = '#e0e0e8';
            ctx.font = 'bold 100px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(Math.floor(score), canvas.width / 2, canvas.height / 2);

            // 左右の壁の描画
            ctx.fillStyle = '#555';
            ctx.fillRect(0, 0, wallWidth, canvas.height);
            ctx.fillRect(canvas.width - wallWidth, 0, wallWidth, canvas.height);

            // トゲの描画
            ctx.fillStyle = '#ff3b30';
            spikes.forEach(spike => {
                ctx.beginPath();
                if (spike.side === 'left') {
                    ctx.moveTo(wallWidth, spike.y);
                    ctx.lineTo(wallWidth + spike.width, spike.y + spike.height / 2);
                    ctx.lineTo(wallWidth, spike.y + spike.height);
                } else {
                    ctx.moveTo(canvas.width - wallWidth, spike.y);
                    ctx.lineTo(canvas.width - wallWidth - spike.width, spike.y + spike.height / 2);
                    ctx.lineTo(canvas.width - wallWidth, spike.y + spike.height);
                }
                ctx.closePath();
                ctx.fill();
            });

            // ボールの描画
            ctx.fillStyle = '#007aff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // スタート画面・ゲームオーバー画面のオーバーレイ
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'white';
                ctx.font = 'bold 32px sans-serif';
                ctx.fillText(gameState === 'START' ? 'TAP TO START' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

                ctx.font = '18px sans-serif';
                if (gameState === 'GAMEOVER') {
                    ctx.fillText('SCORE: ' + Math.floor(score) + '  |  BEST: ' + highScore, canvas.width / 2, canvas.height / 2 + 15);
                }
                ctx.fillText('クリック / タップ / スペースでジャンプ', canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // 初期描画のために一度リセットを呼ぶ
        resetGame();
        loop();
    </script>
</body>
</html>
